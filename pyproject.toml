[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "robodataops"
version = "0.1.0"
description = "Traceable robot demonstration audits and budget-constrained collection planning"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = [
  "duckdb>=1.2,<2",
  "huggingface-hub>=0.29,<2",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "pyarrow>=19,<25",
  "scipy>=1.15,<2",
  "streamlit>=1.45,<2",
]

[project.scripts]
robodataops = "robodataops.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/robodataops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".cache", ".venv", "data", "var", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
